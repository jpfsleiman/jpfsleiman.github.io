# One entry per photo on the Field notes page.
# Put the image file in assets/img/ and add a block here.
#   image:       file name inside assets/img/
#   alt:         one plain sentence describing the picture, for screen readers
#   caption:     what the visitor reads under the photo
#   where:       place and year (optional)
#   placeholder: true marks the entry with a badge until you finish it
# A block with no "image" line draws an empty tile, to hold a spot.

- image: nome-fieldwork.jpg
  alt: Two researchers kneeling on a grassy tundra slope taking measurements beside their packs
  caption: Field work on the tundra.
  where: Nome, Alaska

- image: tundra.jpg
